# Crate manifest for `glean-fb303` — RUST-ONLY SCAFFOLDING, no Haskell
# counterpart. Owned by the crate's first shipped units, the ServiceData
# batch (rust/glean-fb303/src/service_data/types.rs, migration/manifest.tsv
# line 96, and src/service_data/global_stats.rs, line 97 — shipped
# back-to-back in one batch), following the first-unit precedent
# (glean-typed, commit 82b4437; glean-util, commit 4bdf95a): the earliest
# unit of a crate owns its crate scaffolding. No crate in rust/ compiles
# yet (the migration ships file-level drafts); the workspace scaffold that
# pins third-party versions lands at Step 4.

[package]
name = "glean-fb303"
edition = "2021"

[dependencies]
# None. Both shipped units import nothing but std:
#   types.rs (row 96) — Types.hs is a one-definition leaf with zero import
#     declarations (Types.hs:9-11).
#   global_stats.rs (row 97) — GlobalStats.hs:11-14 imports
#     Data.ByteString, Data.HashMap.Strict (qualified) and
#     ServiceData.Types only; all three image to std under RULE §1's
#     strings row (`ByteString` -> `&[u8]`/`Vec<u8>`), the HashMap house
#     image (`HashMap ByteString a` -> `std::collections::HashMap`,
#     glean-db/src/database/storage.rs:492) and the in-crate sibling path
#     (`crate::service_data::types`, RULE §4 imports row).
#
# Anticipated (NOT added now — each lands with its owning unit): the rest
# of this crate's five-unit partition (migration/depmap/crates.txt line 7:
# `glean-fb303	5`) is the github/Facebook/ shared thrift-type-wrapper area
# (depmap_haskell.py CRATE_PREFIXES: "shared thrift-type wrappers
# (fb303/ServiceData) used by core, indexers, server alike — lowest shared
# layer"): rows 178-180 (Fb303.hs, Service/HttpFb303.hs, Service.hs ->
# src/facebook/fb303.rs, src/facebook/service/http_fb303.rs,
# src/facebook/service.rs). Those units name their own deps (likely
# `glean-thrift` for the fb303 thrift images, per the glean-util
# Cargo.toml anticipated-deps convention) when they land; the dep entries
# land with the Step-4 workspace scaffold.
#
# No [dev-dependencies]: tests are not translated (RULE §4 tests row;
# each crate's tests/ holds re-expressed cases at Step 4). No features
# anywhere.
#
# Marker breakdown (closed set — zero of every class): no port todos (the
