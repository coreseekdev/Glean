# Crate manifest for `glean-typed` — RUST-ONLY SCAFFOLDING, no Haskell
# counterpart. Owned by the crate-root unit (rust/glean-typed/src/typed.rs,
# migration/manifest.tsv line 37 — cf. id.rs:113-115's and
# build.rs:148-152's MODULE-WIRING notes, which defer here). No crate in
# rust/ has a Cargo.toml yet (the migration ships file-level drafts that
# need not compile), so this is the honest final-form manifest; the
# workspace scaffold that pins the third-party versions lands at Step 4.

[package]
name = "glean-typed"
edition = "2021"

[dependencies]
# Sibling crates: their file-level drafts are shipped; their Cargo.toml
# scaffolding lands at their own crate-root units (the same class of unit
# as this one).
#
# glean-core — consumers: binary.rs:151-160 (ffi, rts::{builder, set, sys,
# types}), build.rs:160-161 (ffi, rts::sys), build_fact.rs:247-251 (ffi,
# rts::{builder, foreign::define, foreign::fact_set, types}), id.rs:124
# (rts::types::{Fid, Pid}), predicate.rs:216 (rts::types::invalid_pid).
glean-core = { path = "../glean-core" }

# glean-angle — consumers: binary.rs:149-150 (angle::types,
# schema::util), id.rs:119 (display::{Display, DisplayOpts, Doc}),
# predicate.rs:214-215 (angle::types, schema::util).
