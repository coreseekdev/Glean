# Crate manifest for `glean-util` — RUST-ONLY SCAFFOLDING, no Haskell
# counterpart. Owned by this crate's first shipped unit
# (rust/glean-util/src/util/some.rs, migration/manifest.tsv line 38)
# following the glean-typed precedent (rust/glean-typed/Cargo.toml,
# commit 82b4437). No crate in rust/ compiles yet (the migration ships
# file-level drafts); the workspace scaffold that pins third-party
# versions lands at Step 4.

[package]
name = "glean-util"
edition = "2021"

[dependencies]
# None. glean-util is the lowest hand-written crate in the partition
# (migration/depmap/crates.txt: 28 units; its own leaf units import
# nothing in-repo — e.g. Glean/Util/Some.hs has zero imports).
#
# Anticipated (NOT added now — each lands with its owning unit):
# glean-thrift — the generated crate (RULE §1 A10) for the thrift images
# behind `Glean.Service.Types` / `Glean.Types`. Never hand-translated.
# Its two in-crate legs have landed as ASSUMED imports (RULE §4 B4),
# neither adding a [dependencies] entry: the generated-types leg with
# src/util/service.rs (Service.hs:20-21 imports `Glean.Service.Types`;
# ShardManager.hs:22 imports `Glean.Types` qualified), the runtime leg
# (`Thrift.Api`, `Util.EventBase`) with src/util/thrift_service.rs (row
